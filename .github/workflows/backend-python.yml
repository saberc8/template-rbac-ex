name: backend-python-ci

on:
  push:
    paths:
      - "backend-python/**"
      - ".github/workflows/backend-python.yml"
  pull_request:
    paths:
      - "backend-python/**"
      - ".github/workflows/backend-python.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      AUTH_JWT_SECRET: test-secret
      DB_DIALECT: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PWD: postgres
      DB_NAME: ex_admin_v1
      DB_SSLMODE: disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PWD: ""
      REDIS_DB: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend-python/requirements.txt
            backend-python/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend-python/requirements.txt -r backend-python/requirements-dev.txt

      - name: Format check
        working-directory: backend-python
        run: python -m ruff format --check .

      - name: Lint
        working-directory: backend-python
        run: python -m ruff check .

      - name: Type check
        working-directory: backend-python
        run: python -m mypy app tests

      - name: Security scan (Bandit)
        working-directory: backend-python
        run: python -m bandit -q -r app -c bandit.yaml

      - name: Dependency audit (pip-audit)
        run: pip-audit -r backend-python/requirements.txt -r backend-python/requirements-dev.txt

      - name: Tests
        working-directory: backend-python
        run: python -m pytest -q tests
